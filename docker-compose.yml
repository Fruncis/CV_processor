services:
  db:
    image: postgres:15-alpine
    container_name: cv_processor_db
    environment:
      POSTGRES_DB: cv_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cv_processor_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CONFIG_PATH=config.yaml
      - DATABASE_HOST=db
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - ./backend/prompts:/app/prompts:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend_CV_procesor
      dockerfile: Dockerfile
    container_name: cv_processor_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
